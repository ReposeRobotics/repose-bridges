[package]
name = "repose-igus-cri"
description = "Copper bridge for the igus ReBeL over CRI, implementing the Repose robot contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.copper]
kind = "bridge"
domains = ["robotics/igus"]
environments = ["host"]

[features]
# Session Tx channel (acquire/release control, clear faults, enable/disable drives). No motion.
control = []

[dependencies]
cu29.workspace = true
bincode.workspace = true
serde.workspace = true
# Pinned to the Repose commit that added repose-robot-interface (#3).
repose-controller = { git = "https://github.com/ReposeRobotics/repose.git", rev = "d72392230e6eb2c6ff8eae18b063fe9ac31a69f9" }
repose-kinematics = { git = "https://github.com/ReposeRobotics/repose.git", rev = "d72392230e6eb2c6ff8eae18b063fe9ac31a69f9" }
repose-robot-interface = { git = "https://github.com/ReposeRobotics/repose.git", rev = "d72392230e6eb2c6ff8eae18b063fe9ac31a69f9" }

[[example]]
name = "session"
required-features = ["control"]

[[example]]
name = "move"
required-features = ["control"]
