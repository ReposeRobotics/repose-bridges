[package]
name = "repose-igus-cri"
description = "Copper bridge for the igus ReBeL over CRI, implementing the Repose robot contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.copper]
kind = "bridge"
domains = ["robotics/igus"]
environments = ["host"]

[features]
# Session Tx channel (acquire/release control, clear faults, enable/disable drives). No motion.
control = []

[dependencies]
cu29.workspace = true
bincode.workspace = true
serde.workspace = true
# Pinned to ReposeRobotics/repose#3 (robot interface); bump to the merge commit once it lands.
repose-kinematics = { git = "https://github.com/ReposeRobotics/repose.git", rev = "9fe237f986271c7303bb79282edb08d2c35f2c89" }
repose-robot-interface = { git = "https://github.com/ReposeRobotics/repose.git", rev = "9fe237f986271c7303bb79282edb08d2c35f2c89" }

[dev-dependencies]
cu-spatial-payloads = "1.3.0"
ron = "0.12"
serde_json = "1"
repose-robot-description = { git = "https://github.com/ReposeRobotics/repose.git", rev = "9fe237f986271c7303bb79282edb08d2c35f2c89" }
sha2 = "0.10"

[[example]]
name = "session"
required-features = ["control"]
