services:
  ursim:
    image: universalrobots/ursim_e-series:5.25.1
    environment:
      ROBOT_MODEL: UR5
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:30004:30004"
      - "127.0.0.1:30002:30002"
      - "127.0.0.1:29999:29999"
    volumes:
      - programs:/ursim/programs
volumes:
  programs:
