[template]
cargo_generate_version = ">=0.21"
ignore = ["sim/__pycache__"]

[placeholders.robot]
type = "string"
prompt = "Which robot?"
choices = ["igus_rebel", "ur5e", "so_arm"]
default = "igus_rebel"

[conditional.'robot == "igus_rebel"'.placeholders.robot_address]
type = "string"
prompt = "igus ReBeL controller address (ip:port)?"
default = "192.168.3.11:3920"

[conditional.'robot == "ur5e"'.placeholders.robot_address]
type = "string"
prompt = "UR / URSim RTDE address (ip:port)?"
default = "127.0.0.1:30004"

[conditional.'robot == "so_arm"'.placeholders.robot_address]
type = "string"
prompt = "MuJoCo sidecar address (host:port)?"
default = "127.0.0.1:55091"

[hooks]
# Moves robots/<robot>.ron to copperconfig.ron, drops the other profiles,
# and drops the MuJoCo files (sim/, src/sim.rs) unless the robot is so_arm.
post = ["select_robot.rhai"]
